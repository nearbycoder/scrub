name: Scrub
options:
  bundleIdPrefix: com.nearbycoder
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_HARDENED_RUNTIME: NO
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  Scrub:
    type: application
    platform: macOS
    sources:
      - path: Scrub
        excludes:
          - "Resources/AppIcon.icon"
          - "Resources/AppIcon.icon/**"
      - path: Scrub/Resources/AppIcon.icon
        type: file
        buildPhase: resources
    info:
      path: Scrub/Resources/Info.plist
      properties:
        CFBundleDisplayName: Scrub
        CFBundleName: Scrub
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "MIT License. Free and open source."
        NSAppleEventsUsageDescription: "Scrub uses AppleScript to request administrator approval for maintenance tasks."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nearbycoder.scrub
        PRODUCT_NAME: Scrub
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
  ScrubTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ScrubTests
    dependencies:
      - target: Scrub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nearbycoder.scrub.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Scrub.app/Contents/MacOS/Scrub
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Scrub:
    build:
      targets:
        Scrub: all
        ScrubTests: [test]
    test:
      targets:
        - ScrubTests
